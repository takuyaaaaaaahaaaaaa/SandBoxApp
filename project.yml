name: SandBoxApp
options:
  bundleIdPrefix: com.takuyatominaga.sandboxapp
  deploymentTarget:
    iOS: "17.0"

packages:
  Core:
    path: Packages/Core
  IdeaKit:
    path: Packages/IdeaKit
  HelloIdea:
    path: Packages/Ideas/HelloIdea

targets:
  SandBoxApp:
    type: application
    platform: iOS
    sources:
      - path: SandBoxApp
    dependencies:
      - package: Core
      - package: IdeaKit
      - package: HelloIdea
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.takuyatominaga.sandboxapp
        PRODUCT_NAME: SandBoxApp
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: T8T5899N75
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  SandBoxApp:
    build:
      targets:
        SandBoxApp: all
    run:
      config: Debug
    archive:
      config: Release
